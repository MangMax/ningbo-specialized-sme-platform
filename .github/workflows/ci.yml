name: 工程质量检查

on:
  workflow_dispatch:
  schedule:
    - cron: '17 18 * * *'
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: 确定回归测试范围
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.select.outputs.native }}
      app: ${{ steps.select.outputs.app }}
      native_count: ${{ steps.select.outputs.native_count }}
      app_count: ${{ steps.select.outputs.app_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          : > changed-paths.txt
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames "$BASE" HEAD > changed-paths.txt
          fi
          node scripts/select-business-tests.mjs changed-paths.txt

  compile:
    name: 类型与静态规则检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm verify:native-platform-boundary
      - run: pnpm verify:module-boundaries
      - run: pnpm verify:sql
      - run: node scripts/generate-roster-import-discovery.mjs --check

  build:
    name: 构建应用产物
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node scripts/verify-native-platform-boundary.mjs --built
      - run: node scripts/generate-logging-route-templates.mjs --check
      - run: tar -czf test-build.tar.gz .output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-build
          path: test-build.tar.gz
          retention-days: 1

  discovery:
    name: 校验开发服务接口契约
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-postgres-tests
      - run: node tests/support/development-discovery.mjs development-discovery.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: development-discovery
          path: development-discovery.json
          retention-days: 1

  native:
    needs: coverage
    if: needs.coverage.outputs.native_count != '0'
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage.outputs.native).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-postgres-tests
      - name: Run tests within the workflow time budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          started=$(date -d "$run_started_at" +%s)
          elapsed=$(( $(date +%s) - started ))
          remaining=$(( 300 - elapsed ))
          echo "Workflow elapsed: ${elapsed}s; remaining test budget: ${remaining}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$remaining" -le 0 ]; then
            echo '::error::Workflow exceeded its five-minute budget before tests started'
            exit 1
          fi
          result=0
          timeout --signal=TERM --kill-after=5s "${remaining}s" node scripts/business-test-groups.mjs run "${{ matrix.group }}" --reporter=default --reporter=json --outputFile=test-results.json || result=$?
          elapsed=$(( $(date +%s) - started ))
          echo "Workflow elapsed after tests: ${elapsed}s (exit ${result})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
            echo '::error::Five-minute workflow budget exceeded; optimize the slow suites before retrying'
          fi
          exit "$result"
      - name: Require PostgreSQL cases to have run
        if: matrix.postgres
        run: node scripts/business-test-groups.mjs verify-postgres test-results.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.group }}-results
          path: test-results.json
          if-no-files-found: warn
          retention-days: 7

  app:
    needs: [build, coverage, discovery]
    if: needs.coverage.outputs.app_count != '0'
    name: ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.coverage.outputs.app).include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-postgres-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-build
      - run: tar -xzf test-build.tar.gz
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: development-discovery
      - name: Run tests within the workflow time budget
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_DISCOVERY_ARTIFACT: ${{ github.workspace }}/development-discovery.json
          APP_SHARD: ${{ matrix.project }}
          BUSINESS_GROUP: ${{ matrix.group }}
        run: |
          run_started_at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          started=$(date -d "$run_started_at" +%s)
          elapsed=$(( $(date +%s) - started ))
          remaining=$(( 300 - elapsed ))
          echo "Workflow elapsed: ${elapsed}s; remaining test budget: ${remaining}s" >> "$GITHUB_STEP_SUMMARY"
          if [ "$remaining" -le 0 ]; then
            echo '::error::Workflow exceeded its five-minute budget before tests started'
            exit 1
          fi
          result=0
          if [ "$APP_SHARD" = watcher ]; then
            command=(pnpm test --project=deep --maxWorkers=1 --no-file-parallelism)
          else
            command=(node scripts/business-test-groups.mjs run "$BUSINESS_GROUP")
          fi
          timeout --signal=TERM --kill-after=5s "${remaining}s" "${command[@]}" --reporter=default --reporter=json --outputFile=test-results.json || result=$?
          elapsed=$(( $(date +%s) - started ))
          echo "Workflow elapsed after tests: ${elapsed}s (exit ${result})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -eq 124 ] || [ "$result" -eq 137 ]; then
            echo '::error::Five-minute workflow budget exceeded; optimize the slow suites before retrying'
          fi
          exit "$result"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ matrix.group }}-results
          path: |
            test-results.json
            /tmp/export-188-*/missing-log-event.json
          if-no-files-found: warn
          retention-days: 7

  check:
    name: CI 总门禁
    if: always()
    needs: [coverage, compile, build, discovery, native, app]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check
        env:
          COMPILE_RESULT: ${{ needs.compile.result }}
          DISCOVERY_RESULT: ${{ needs.discovery.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          APP_RESULT: ${{ needs.app.result }}
          NATIVE_COUNT: ${{ needs.coverage.outputs.native_count }}
          APP_COUNT: ${{ needs.coverage.outputs.app_count }}
        run: |
          test "$DISCOVERY_RESULT" = success
          test "$COMPILE_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$COVERAGE_RESULT" = success
          if [ "$NATIVE_COUNT" = 0 ]; then test "$NATIVE_RESULT" = skipped; else test "$NATIVE_RESULT" = success; fi
          if [ "$APP_COUNT" = 0 ]; then test "$APP_RESULT" = skipped; else test "$APP_RESULT" = success; fi
