interface:
  display_name: "名录清洗与入库"
  short_description: "通过应用 API/MCP 清洗入库名录、采集平台证据并判断称号差异。"
  default_prompt: "使用 $roster-ingestion-pipeline 清洗或入库名录文件、采集平台证据，或查证并判断称号差异。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "凭据、业务数据库和源文件不得进入 Git。"
  degradation:
    openai: "遵循 SKILL.md；当前不支持的情况保留待处理。"
