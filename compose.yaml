name: spztx-roster

services:
  postgres:
    profiles: [postgres-local]
    image: postgres:19.0-bookworm@sha256:f4859caf96de494e38efa69ed703b08a5bbd9605e152e604f2daec8841c87c41
    env_file:
      - ${ROSTER_POSTGRES_ENV_FILE:-/dev/null}
    environment:
      POSTGRES_DB: roster
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "roster"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    image: spztx-roster:${CONFIG_SHA:?Set CONFIG_SHA to the deployment configuration commit SHA}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_SHA:?Set SOURCE_SHA to the full deployment configuration commit SHA}
    env_file:
      - ${ROSTER_ENV_FILE:-/dev/null}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_ROSTER_EXPORT_DIR: ${ROSTER_EXPORT_DIR:-/state/data/roster.db.exports}
      NUXT_FILES_DIR: /state/files
      NUXT_INCOMING_DIR: /state/incoming
      NUXT_CURATED_PATH: /state/data/reconciliation-curated.json
      NUXT_RECONCILE_PATH: /state/data/platform-reconcile.json
      NUXT_TUS_ALLOWED_ORIGINS: "http://localhost:${ROSTER_PORT:-3480},http://127.0.0.1:${ROSTER_PORT:-3480}"
    ports:
      - "127.0.0.1:${ROSTER_PORT:-3480}:3000"
    volumes:
      - type: bind
        source: ${ROSTER_STATE_DIR:?Set ROSTER_STATE_DIR to an absolute persistent state directory outside the repository}
        target: /state
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
