name: spztx-roster

services:
  app:
    image: spztx-roster:${CONFIG_SHA:?Set CONFIG_SHA to the deployment configuration commit SHA}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_SHA:?Set SOURCE_SHA to the full deployment configuration commit SHA}
    env_file:
      - ${ROSTER_ENV_FILE:-/dev/null}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_DB_PATH: /state/data/roster.db
      NUXT_LOG_DIR: /logs
      NUXT_FILES_DIR: /state/files
      NUXT_INCOMING_DIR: /state/incoming
      NUXT_CURATED_PATH: /state/data/reconciliation-curated.json
      NUXT_RECONCILE_PATH: /state/data/platform-reconcile.json
      NUXT_TUS_ALLOWED_ORIGINS: "http://localhost:${ROSTER_PORT:-3480},http://127.0.0.1:${ROSTER_PORT:-3480}"
    ports:
      - "127.0.0.1:${ROSTER_PORT:-3480}:3000"
    volumes:
      - type: volume
        source: runtime-logs
        target: /logs
      - type: bind
        source: ${ROSTER_STATE_DIR:?Set ROSTER_STATE_DIR to an absolute persistent state directory outside the repository}
        target: /state
        bind:
          create_host_path: false
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  runtime-logs:
